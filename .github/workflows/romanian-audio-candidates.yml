name: Romanian audio candidates

on:
  workflow_dispatch:
  push:
    branches: [audio/azure-*]

permissions:
  contents: write

jobs:
  generate:
    if: startsWith(github.ref, 'refs/heads/audio/azure-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install audio trimming tool
        env:
          AZURE_REBUILD_AUDIO: ${{ github.ref_name == 'audio/azure-repair-truncation' && '1' || '0' }}
        run: |
          if [ "$AZURE_REBUILD_AUDIO" != '1' ] && node -e "const fs = require('node:fs'); const catalog = require('./scripts/romanian-audio-catalog.json'); process.exit(catalog.every(item => fs.existsSync('public/audio/romanian/verified/' + item.slug + '.mp3')) ? 0 : 1)"; then
            echo "All catalog clips already exist; no trimming tool needed."
          else
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
      - name: Generate candidate Romanian recordings
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: eastus
          AZURE_SPEECH_VOICE: ro-RO-AlinaNeural
          AZURE_REBUILD_AUDIO: ${{ github.ref_name == 'audio/azure-repair-truncation' && '1' || '0' }}
        run: node scripts/generateAzureRomanianAudio.mjs
      - name: Publish exact-text recordings to the branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/audio/romanian/verified src/content/romanian/verified-audio.json
          if ! git diff --cached --quiet; then
            git commit -m 'Add Azure Romanian recordings for lessons'
            git push origin HEAD:${{ github.ref_name }}
          fi
      - name: Keep recordings for pronunciation review
        uses: actions/upload-artifact@v4
        with:
          name: romanian-audio-candidates
          path: public/audio/romanian/verified/*.mp3
          if-no-files-found: error
          retention-days: 14

